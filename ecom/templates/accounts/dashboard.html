{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="section-content padding-y bg">
  {% include 'includes/alerts.html' %}
  <div class="container">
    <div class="row">
      {% include 'includes/dashboard_sidebar.html' %}
      <main class="col-md-9">
        <article class="card shadow-sm rounded-3">
          <header class="card-header">
            <strong class="d-inline-block mr-3">Xin chào:</strong>
            <span>{{ user.full_name }}</span>
          </header>
          <div class="card-body">
            <div class="row">
              <!-- Tổng số đơn hàng -->
              <div class="col-md-6">
                <div class="card shadow-sm mb-3">
                  <div class="card-body">
                    <h5 class="card-title text-primary">
                      <i class="fa fa-shopping-bag mr-2"></i> Tổng số đơn hàng
                    </h5>
                    <h4>{{ orders_count }}</h4>
                    <a href="{% url 'my_orders' %}" class="btn btn-link p-0">Xem đơn hàng</a>
                  </div>
                </div>
              </div>
              <!-- Thông tin cá nhân -->
              <div class="col-md-6">
                <div class="card shadow-sm mb-3">
                  <div class="card-body d-flex align-items-center">
                    <img src="{% if userprofile.profile_picture %}{{ userprofile.profile_picture.url }}{% else %}{% static 'default/default-user.jpg' %}{% endif %}"
                         alt="Ảnh đại diện"
                         width="50"
                         height="50"
                         style="border-radius: 50%; margin-right: 12px;">
                    <div>
                      <div><i class="fa fa-envelope mr-2"></i> {{ user.email }}</div>
                      <div><i class="fa fa-phone mr-2"></i> {{ user.phone_number }}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div> <!-- row -->
          </div> <!-- card-body -->
          <div class="table-responsive">

          </div>
        </article>
      </main>
    </div> <!-- row -->
  </div>
</section>

{% endblock %}
