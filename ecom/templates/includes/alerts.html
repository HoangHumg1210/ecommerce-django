{% if messages %}
  <div class="alert-container d-flex justify-content-center align-items-center">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-autohide d-flex align-items-center" style="margin-top:16px;">
        {% if message.tags == "success" %}
          <i class="fa fa-check-circle mr-2" style="color: #27ae60; font-size: 1.3em;"></i>
        {% elif message.tags == "warning" %}
          <i class="fa fa-exclamation-triangle mr-2" style="color: #f39c12; font-size: 1.3em;"></i>
        {% elif message.tags == "info" %}
          <i class="fa fa-info-circle mr-2" style="color: #3498db; font-size: 1.3em;"></i>
        {% elif message.tags == "error" or message.tags == "danger" %}
          <i class="fa fa-times-circle mr-2" style="color: #e74c3c; font-size: 1.3em;"></i>
        {% endif %}
        <span>{{ message }}</span>
        <button type="button" class="close ml-auto" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
