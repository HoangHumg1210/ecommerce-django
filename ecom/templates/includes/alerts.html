{% if messages %}
  <div class="alert-container d-flex justify-content-center align-items-center">
    {% for message in messages %}
      <div class="custom-alert alert alert-{{ message.tags }} alert-dismissible fade show px-4 py-3 mb-3 shadow rounded-3" role="alert">
        {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
          <i class="fa fa-times-circle mr-2" style="color: #e74c3c; font-size: 1.3em;"></i>
        {% elif message.tags == "success" %}
          <i class="fa fa-check-circle mr-2" style="color: #27ae60; font-size: 1.3em;"></i>
        {% elif message.tags == "warning" %}
          <i class="fa fa-exclamation-triangle mr-2" style="color: #f39c12; font-size: 1.3em;"></i>
        {% elif message.tags == "info" %}
          <i class="fa fa-info-circle mr-2" style="color: #3498db; font-size: 1.3em;"></i>
        {% endif %}
        {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
